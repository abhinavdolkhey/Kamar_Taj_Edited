<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Background circular emblem with mystic Kamar-Taj concentric ring -->
  <circle cx="50" cy="50" r="46" fill="#1E1B4B" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 2"/>
  
  <!-- Outer mystic aura ring -->
  <circle cx="50" cy="50" r="39" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Dining Cloche / Cloak Motif -->
  <path d="M26 62 C26 44, 37 34, 50 34 C63 34, 74 44, 74 62 Z" fill="#F8FAFC" opacity="0.95"/>
  
  <!-- Cloche Top Handle (Mystic Orb) -->
  <circle cx="50" cy="30" r="4" fill="#F59E0B"/>
  <path d="M50 34 L50 30" stroke="#F59E0B" stroke-width="2"/>

  <!-- Base Plate / Serving Platter in Mystic Violet & Eldritch Gold -->
  <path d="M22 64 C22 62.5, 78 62.5, 78 64 C78 67, 70 69, 50 69 C30 69, 22 67, 22 64 Z" fill="#7C3AED"/>
  <line x1="20" y1="65" x2="80" y2="65" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Mystic Eldritch Spire lines -->
  <path d="M44 24 C43 20, 46 17, 44 14" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 23 C49 19, 52 16, 50 12" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
  <path d="M56 24 C55 20, 58 17, 56 14" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
</svg>
